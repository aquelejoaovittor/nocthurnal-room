[package]
name        = "nroom"
description = "Nocthurnal Room CLI — create, validate and inspect .nroom presets"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[[bin]]
name = "nroom"
path = "src/main.rs"

[dependencies]
nocthurnal-room-core = { path = "../core" }
clap                 = { version = "4", features = ["derive"] }
serde_json           = "1"
anyhow               = "1"
